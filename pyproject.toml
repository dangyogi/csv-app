# pyproject.toml for csv-app

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["csv_app"]

[project]
name = "csv-app"
version = "0.0.1"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11.2"
dependencies = ["reportlab>=4.4.9"]

[project.urls]
repository = "https://github.com/dangyogi/csv-app.git"

[project.scripts]
report = "csv_app.report:run"
